<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sections</title>
        <link rel="shortcut icon" href="assets/icons/html_icon.png" type="image/x-icon">
        <style>
            header{
                background-color: rgba(255, 0, 0, 0.1);
            }
            main{
                background-color: rgba(0, 0, 255, 0.1);
            }
            footer{
                background-color: rgba(0, 255, 0, 0.1);
            }
        </style>
    </head>
    <body>
        <header>
            <h2>Header tag</h2>
            <nav>
                <ul>
                    <li>Visit <a href="https://example.com" target="_blank">example website</a></li>
                    <li>Find more <a href="about.html" target="_blank">about me</a></li>
                </ul>
            </nav>
            <hr />
        </header>
        <main>
            <dl>
                <dt>What time is it?</dt>
                <dd>It's <time datetime="10:30">10:30 AM</time></dd>
            </dl>
            <div>This is a div</div>
            <section>This is a section</section>
            <hr>
            <article>
            <p>This is my blog</p>
            <figure>
                <img
                src="assets/images/image.jpg"
                alt="Building image"
                title="Building image with wall
                painted in yellow"
                width="200"
                height="300"
                />
                </figure>
            </article>
        </main>
        <footer>
            <h2>Footer section</h2>
        </footer>
    </body>
</html>
