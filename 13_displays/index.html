<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS</title>
        <link rel="stylesheet" href="styles/index.css">
    </head>
    <body>
        <h3><u>Display Block</u></h3>
        <div class="box block">
            <h4>Display - block</h4>
        </div>
        <hr>
        <h3><u>Display Inline</u></h3>
        <h4 class="inline">This is fisrt paragraph</h4>
        <h4 class="inline">This is another paragraph</h4>
        <hr>

        <div class="box inline-block">
            <h4>1 - This display is inline-block</h4>
        </div>
        
        <div class="box inline-block">
            <h4>2 - This display is inline-block</h4>
        </div>
    </body>
</html>
